<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="ComfyUI 模型目录映射工具">
  <title>ComfyUI 模型目录映射工具 · Banner</title>
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f7fafd"/>
      <stop offset="0.6" stop-color="#e9f0f8"/>
      <stop offset="1"   stop-color="#dde7f2"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3aa0f0"/>
      <stop offset="0.55" stop-color="#0078d4"/>
      <stop offset="1"    stop-color="#00539c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bgB)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0078d4"/>

  <!-- 图标 -->
  <g transform="translate(96 176) scale(0.5625)">
    <rect width="512" height="512" rx="112" fill="url(#tileB)"/>
    <g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.92">
      <path d="M128 184 C 128 232 172 252 236 268"/>
      <path d="M256 138 L 256 268"/>
      <path d="M384 184 C 384 232 340 252 276 268"/>
    </g>
    <g fill="#ffffff">
      <circle cx="128" cy="150" r="34"/>
      <circle cx="256" cy="104" r="34"/>
      <circle cx="384" cy="150" r="34"/>
    </g>
    <path fill="#ffffff" d="M150 222 h84 a16 16 0 0 1 16 16 v14 h112 a18 18 0 0 1 18 18
                            v112 a18 18 0 0 1 -18 18 H150 a18 18 0 0 1 -18 -18 V240
                            a18 18 0 0 1 18 -18 z"/>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="400" y="268" font-size="58" font-weight="700" fill="#16202b"
          >ComfyUI 模型目录映射工具</text>
    <text x="400" y="342" font-size="34" font-weight="600" fill="#0078d4"
          >多个整合包，共用一份模型仓库</text>
    <text x="400" y="404" font-size="25" fill="#5b6470"
          >Windows 目录联接 · 免管理员权限 · 不移动也不删除模型</text>

    <g>
      <rect x="400" y="440" width="196" height="46" rx="23" fill="#e5f1fb"/>
      <text x="498" y="471" font-size="22" font-weight="700" fill="#0078d4"
            text-anchor="middle">MIT 开源 · 零依赖</text>
    </g>

    <text x="400" y="556" font-size="25" fill="#0078d4"
          font-family="Consolas, monospace">github.com/leeymxz/comfy-models-mapper</text>
  </g>
</svg>
